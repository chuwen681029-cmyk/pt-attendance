<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>實習差勤系統</title>
<style>
  :root {
    --bg:#f4f7f6; --card:#ffffff; --ink:#1d2b2a; --muted:#5f716f; --line:#e1e8e6;
    --accent:#0f766e; --accent-soft:#e3f3f0; --warn:#b45309; --warn-soft:#fff4e5;
    --bad:#b91c1c; --bad-soft:#fdecec; --ok:#15803d; --ok-soft:#e8f6ec;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; font-size:16px; line-height:1.55; }
  header { position:sticky; top:0; z-index:5; background:var(--accent); color:#fff; padding:14px 16px; }
  header .t { font-weight:700; font-size:17px; }
  header .s { font-size:13px; opacity:.9; }
  main { padding:16px 16px 96px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 8px; font-size:17px; }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  textarea { min-height:80px; resize:vertical; }
  button { font:inherit; border:0; border-radius:10px; padding:11px 16px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.ghost { background:var(--accent-soft); color:var(--accent); }
  button.danger { background:var(--bad-soft); color:var(--bad); }
  button.block { width:100%; }
  button.big { padding:22px; font-size:20px; border-radius:16px; }
  button:disabled { opacity:.5; }
  .chip { display:inline-block; font-size:13px; padding:2px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin:2px 4px 2px 0; }
  .chip.warn { background:var(--warn-soft); color:var(--warn); }
  .chip.bad { background:var(--bad-soft); color:var(--bad); }
  .chip.ok { background:var(--ok-soft); color:var(--ok); }
  .chip.gray { background:#eef1f0; color:var(--muted); }
  .notice { border-radius:12px; padding:12px 14px; margin:10px 0; font-size:15px; white-space:pre-line; }
  .pdca-box { background:var(--bg); border-radius:10px; padding:10px 12px; margin:6px 0; font-size:14px; white-space:pre-wrap; }
  .pdca-box b { display:block; color:var(--accent); font-size:13px; margin-bottom:2px; }
  .counter { text-align:right; font-size:13px; color:var(--muted); margin-top:4px; }
  .counter.ok { color:var(--ok); }
  .bfrow { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .bfrow input { padding:8px 6px; }
  .bfhead { font-size:13px; color:var(--muted); font-weight:600; padding-top:14px; }
  .bfrow .chip { font-size:11px; white-space:nowrap; padding:1px 6px; margin:2px 0 0; }
  .notice.warn { background:var(--warn-soft); color:var(--warn); }
  .notice.bad { background:var(--bad-soft); color:var(--bad); }
  .notice.ok { background:var(--ok-soft); color:var(--ok); }
  .notice.info { background:var(--accent-soft); color:var(--accent); }
  .stat { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat div { background:var(--bg); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:24px; }
  .stat span { font-size:13px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .tablewrap { overflow-x:auto; }
  .log { font-size:13px; color:var(--muted); margin:8px 0 0; padding-left:18px; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; min-width:0; background:none; color:var(--muted); border-radius:0; padding:10px 0 12px; font-size:12px; font-weight:600; position:relative; white-space:nowrap; letter-spacing:-.02em; }
  nav button.on { color:var(--accent); }
  nav button .ico { display:block; font-size:20px; line-height:1.2; }
  .badge { position:absolute; top:4px; right:calc(50% - 22px); background:var(--bad); color:#fff; font-size:11px; border-radius:999px; padding:0 6px; }
  .center { text-align:center; padding:40px 16px; color:var(--muted); }
  .result { text-align:center; padding:20px 10px; }
  .result .big { font-size:40px; font-weight:700; }
  hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
</style>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<header><div class="t">物理治療實習差勤系統</div><div class="s" id="who">載入中…</div></header>
<main id="main"><div class="center">載入中…</div></main>
<nav id="nav" hidden></nav>
<script src="config.js"></script>
<script>
(function () {
  const CFG = window.APP_CONFIG;
  const $main = document.getElementById('main');
  const $nav = document.getElementById('nav');
  let idToken = '', ME = null, currentTab = '';
  const cache = {};

  /* ---------- 工具 ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = (s) => { $main.innerHTML = s; };
  const fmtH = n => (Math.round(n * 10) / 10) + ' 小時';
  const balText = b => b >= 0 ? '可用值班時數 ' + fmtH(b) : '需補實習 ' + fmtH(-b);
  const statusChip = s => '<span class="chip ' + ({ '已核准': 'ok', '已退回': 'bad', '已撤回': 'gray' }[s] || '') + '">' + esc(s) + '</span>';
  function loading(msg) { h('<div class="center">' + esc(msg || '處理中…') + '</div>'); }
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'notice ' + (kind || 'info');
    el.style.cssText = 'position:fixed;left:16px;right:16px;top:70px;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.12)';
    el.textContent = msg; document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function api(action, data) {
    const res = await fetch(CFG.GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, idToken }, data || {})) });
    const j = await res.json();
    if (!j.ok) {
      if (j.code === 'TOKEN_EXPIRED' && !sessionStorage.getItem('pt_reloaded')) {
        sessionStorage.setItem('pt_reloaded', '1'); location.reload();
      }
      throw new Error(j.error || '發生錯誤');
    }
    sessionStorage.removeItem('pt_reloaded');
    return j;
  }

  /* ---------- 啟動 ---------- */
  async function boot() {
    try {
      await liff.init({ liffId: CFG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      idToken = liff.getIDToken();
      ME = await api('me');
      if (!ME.bound) return renderBind();
      document.getElementById('who').textContent = ME.profile.name + '（' + ME.profile.roles.join('、') + '）';
      const p = new URLSearchParams(location.search);
      buildNav();
      if (p.get('k') && p.get('s') && p.get('t') && ME.isStudent) {
        history.replaceState(null, '', location.pathname);
        switchTab('punch');
        doPunch({ k: p.get('k'), s: p.get('s'), t: p.get('t') });
      } else if (p.get('view') === 'approve') {
        switchTab('approve');
      } else if (p.get('view') === 'overview' && ME.isAdmin) {
        switchTab('overview');
      } else if (p.get('view') === 'pdca' && ME.isStudent) {
        switchTab('pdca');
      } else if (ME.isStudent && ME.pdcaTodo) {
        switchTab('pdca');
      } else {
        switchTab(ME.isStudent ? 'punch' : (ME.isAdmin ? 'overview' : 'approve'));
      }
    } catch (e) {
      h('<div class="card"><h3>無法載入</h3><p>' + esc(e.message) + '</p><button onclick="location.reload()">重新載入</button></div>');
    }
  }

  /* ---------- 綁定 ---------- */
  function renderBind() {
    document.getElementById('who').textContent = '首次使用，請綁定身分';
    h('<div class="card"><h3>綁定身分</h3><p class="muted">請輸入差勤負責老師提供的 6 碼綁定碼。綁定後此 LINE 帳號即代表您本人，請勿將綁定碼交給他人。</p>' +
      '<label>綁定碼</label><input id="code" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-size:20px">' +
      '<div style="margin-top:14px"><button class="block" id="bindBtn">綁定</button></div></div>');
    document.getElementById('bindBtn').onclick = async () => {
      const code = document.getElementById('code').value.trim();
      if (!code) return toast('請輸入綁定碼', 'warn');
      try { loading('綁定中…'); const r = await api('bind', { code }); toast(r.message, 'ok'); setTimeout(() => location.reload(), 1200); }
      catch (e) { toast(e.message, 'bad'); renderBind(); }
    };
  }

  /* ---------- 導覽列 ---------- */
  function tabsFor() {
    const t = [];
    if (ME.isStudent) t.push(['punch', '⏱', '打卡'], ['leave', '📝', '請假'], ['myleaves', '📄', '我的假單'], ['pdca', '📋', 'PDCA'], ['duty', '🌙', '夜診值班'], ['hours', '⌛', '時數']);
    // 只有學生身分的人不需要簽核分頁（已取消代理人關卡）
    if (ME.profile.roles.some(r => r !== '學生') || ME.pendingCount) t.push(['approve', '✅', '簽核']);
    if (ME.isAdmin) t.push(['overview', '📊', '總覽'], ['backfill', '🗂', '補登打卡'], ['ledger', '➕', '登錄時數']);
    return t;
  }
  function buildNav() {
    $nav.hidden = false;
    $nav.innerHTML = tabsFor().map(([id, ico, name]) =>
      '<button data-tab="' + id + '"><span class="ico">' + ico + '</span>' + name +
      (id === 'approve' && ME.pendingCount ? '<span class="badge">' + ME.pendingCount + '</span>' : '') +
      (id === 'pdca' && ME.pdcaTodo ? '<span class="badge">' + ME.pdcaTodo + '</span>' : '') + '</button>').join('');
    $nav.querySelectorAll('button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  }
  function switchTab(id) {
    currentTab = id;
    $nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
    window.scrollTo(0, 0);
    ({ punch: renderPunch, leave: renderLeave, myleaves: renderMyLeaves, pdca: renderPdca, duty: renderDuty, hours: renderHours,
       approve: renderApprove, overview: renderOverview, backfill: renderBackfill, ledger: renderLedger }[id] || renderPunch)();
  }

  /* ---------- 打卡 ---------- */
  function renderPunch(resultHtml) {
    const list = (ME.todayPunches || []).map(p =>
      '<tr><td>' + esc(p.time) + '</td><td>' + esc(p.type) + '</td><td>' + verdictChip(p.verdict) + '</td></tr>').join('');
    h((resultHtml || '') +
      '<div class="card"><h3>掃描打卡</h3><p class="muted">請到物理治療辦公室（或虎尾站）的打卡電腦前，按下方按鈕掃描螢幕上的 QR Code。上班 08:00、下班 17:00。</p>' +
      '<button class="block big" id="scanBtn">📷　掃描打卡</button></div>' +
      '<div class="card"><h3>今日打卡紀錄</h3>' + (list ? '<table><tr><th>時間</th><th>類型</th><th>判定</th></tr>' + list + '</table>' : '<p class="muted">今天尚未打卡</p>') + '</div>' +
      '<div class="card"><h3>忘了簽到／簽退？補簽申請</h3>' +
      '<p class="muted">由當天的臨床指導老師確認（忘簽到看上午、忘簽退看下午的老師），最晚下一個上班日申請。確認後需寫 PDCA，不需補實習時數。</p>' +
      '<div class="grid2"><div><label>日期</label><input type="date" id="fx_date" value="' + ME.meta.today + '" max="' + ME.meta.today + '"></div>' +
      '<div><label>類型</label><select id="fx_kind"><option value="out">忘了簽退</option><option value="in">忘了簽到</option></select></div></div>' +
      '<label id="fx_tl">實際離開時間</label><input type="time" id="fx_time" value="17:00">' +
      '<label>說明（選填）</label><input id="fx_note" placeholder="例如：下班時趕著離開忘了掃描">' +
      '<button class="block" id="fx_btn" style="margin-top:10px">送出給臨床指導老師確認</button>' +
      '<div id="fx_list" style="margin-top:10px"></div></div>');
    document.getElementById('scanBtn').onclick = scan;
    bindFix();
  }
  async function bindFix() {
    const g = id => document.getElementById(id);
    if (!g('fx_btn')) return;
    g('fx_kind').onchange = () => {
      const isIn = g('fx_kind').value === 'in';
      g('fx_tl').textContent = isIn ? '實際到班時間' : '實際離開時間';
      g('fx_time').value = isIn ? '08:00' : '17:00';
    };
    g('fx_btn').onclick = async () => {
      if (!g('fx_date').value || !g('fx_time').value) return toast('請填寫日期與時間', 'warn');
      const b = g('fx_btn'); b.disabled = true; b.textContent = '送出中…';
      try { const r = await api('fixSubmit', { date: g('fx_date').value, kind: g('fx_kind').value, time: g('fx_time').value, note: g('fx_note').value }); toast(r.message, 'ok'); renderPunch(); }
      catch (e) { toast(e.message, 'bad'); b.disabled = false; b.textContent = '送出給臨床指導老師確認'; }
    };
    try {
      const r = await api('myFixes');
      if (g('fx_date')) g('fx_date').min = r.earliest;
      if (!r.fixes.length || !g('fx_list')) return;
      g('fx_list').innerHTML = '<div class="tablewrap"><table><tr><th>日期</th><th>類型</th><th>時間</th><th>狀態</th><th></th></tr>' +
        r.fixes.map(f => '<tr><td>' + esc(f.date) + '</td><td>' + esc(f.kind) + '</td><td>' + esc(f.time) + '</td><td>' + dutyChip(f.status) +
          (f.comment ? '<br><span class="muted">' + esc(f.comment) + '</span>' : '') + '</td><td>' +
          (f.status === '待確認' ? '<button class="danger" style="padding:6px 10px" data-fxc="' + esc(f.id) + '">撤回</button>' : '') + '</td></tr>').join('') + '</table></div>';
      $main.querySelectorAll('[data-fxc]').forEach(b => b.onclick = async () => {
        if (!confirm('確定撤回這筆補簽申請？')) return;
        try { const x = await api('fixCancel', { fixId: b.dataset.fxc }); toast(x.message, 'ok'); } catch (e) { toast(e.message, 'bad'); }
        renderPunch();
      });
    } catch (e) { /* 讀取失敗不影響打卡 */ }
  }
  function verdictChip(v) {
    const cls = v === '遲到' || v === '早退' ? 'warn' : v === '正常' ? 'ok' : 'gray';
    return '<span class="chip ' + cls + '">' + esc(v) + '</span>';
  }
  async function scan() {
    if (!liff.isInClient() || !liff.isApiAvailable('scanCodeV2')) return toast('請在手機 LINE 中開啟本頁才能掃描', 'warn');
    try {
      const r = await liff.scanCodeV2();
      if (!r || !r.value) return;
      let p;
      try { p = new URL(r.value).searchParams; } catch (e) { return toast('這不是打卡站的 QR Code', 'bad'); }
      doPunch({ k: p.get('k'), s: p.get('s'), t: p.get('t') });
    } catch (e) { toast('掃描未完成：' + e.message, 'warn'); }
  }
  async function doPunch(q) {
    loading('打卡中…');
    try {
      const r = await api('punch', q);
      if (r.needConfirm) {
        renderPunch('<div class="card result"><div class="big">' + esc(r.time) + '</div>' +
          '<div style="font-size:20px;margin:6px 0">還沒到下班時間 ' + esc(r.expect) + '</div>' +
          '<div class="notice warn" style="text-align:left;white-space:pre-line">' + esc(r.message) + '</div>' +
          '<div class="grid2" style="margin-top:10px"><button id="earlyNo">取消（下班再簽）</button>' +
          '<button class="danger" id="earlyYes">確定提早簽退</button></div></div>');
        document.getElementById('earlyNo').onclick = () => { renderPunch('<div class="notice info">已取消，這次沒有記錄簽退。下班後請再掃描一次。</div>'); };
        document.getElementById('earlyYes').onclick = () => doPunch({ k: r.k, token: r.token, confirmEarly: true, choice: r.choice, arriveTime: r.arriveTime });
        return;
      }
      if (r.needChoice) {
        renderPunch('<div class="card result"><div class="big">' + esc(r.time) + '</div>' +
          '<div class="notice warn" style="text-align:left">' + esc(r.message) + '</div>' +
          '<button class="block" id="chIn" style="margin-top:8px">我現在才到班 → 記為簽到（遲到）</button>' +
          '<div style="border-top:1px solid #eee;margin-top:14px;padding-top:10px;text-align:left">' +
          '<b>早上忘了簽到，現在要下班</b><label>早上實際到班時間</label><input type="time" id="chTime" value="' + esc(r.expect) + '">' +
          '<p class="muted" style="margin:4px 0 0">會記為簽退，並送出忘簽到的補簽申請給上午的臨床指導老師確認；確認後需寫 PDCA（不需補實習時數）。</p>' +
          '<button class="block" id="chForgot" style="margin-top:8px">記為簽退＋申請補簽到</button></div>' +
          '<button class="block" id="chCancel" style="margin-top:8px;background:#eee;color:#333">取消</button></div>');
        document.getElementById('chIn').onclick = () => doPunch({ k: r.k, token: r.token, choice: 'in' });
        document.getElementById('chForgot').onclick = () => {
          const t = document.getElementById('chTime').value;
          if (!t) return toast('請填寫早上實際到班時間', 'warn');
          doPunch({ k: r.k, token: r.token, choice: 'forgotIn', arriveTime: t });
        };
        document.getElementById('chCancel').onclick = () => renderPunch('<div class="notice info">已取消，這次沒有記錄。</div>');
        return;
      }
      const kind = r.verdict === '遲到' || r.verdict === '早退' ? 'warn' : 'ok';
      if (!r.duplicate) ME.todayPunches = (ME.todayPunches || []).concat([{ time: r.time, type: r.type, verdict: r.verdict }]);
      renderPunch('<div class="card result"><div class="big">' + esc(r.time) + '</div><div style="font-size:20px;margin:6px 0">' +
        esc(r.type) + '　' + verdictChip(r.verdict) + '</div>' +
        (r.station ? '<div class="muted">' + esc(r.station) + '</div>' : '') +
        '<div class="notice ' + kind + '">' + esc(r.message) + '</div></div>');
    } catch (e) {
      renderPunch('<div class="notice bad">打卡失敗：' + esc(e.message) + '</div>');
    }
  }

  /* ---------- 請假 ---------- */
  function renderLeave() {
    const m = ME.meta;
    const types = Object.keys(m.leaveTypes);
    const opt = (v, t, sel) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(t) + '</option>';
    const slots = (sel) => m.slots.map((s, i) => opt(i, s, i === sel)).join('');
    const proxyNeeded = m.chain.includes('代理人');
    h('<div class="card"><h3>線上請假</h3>' +
      '<div class="notice info">請假需於 3 個工作天前提出（病假、生理假除外）。最小單位 2 小時。值班補休需有足夠的夜診值班時數；實習結束前最後兩週可提前休最多 8 小時，結束後再補。實習最後一週（結束日前 7 天內）請事假、值班補休需寫 PDCA。' +
        (m.leaveMode === 'parallel' ? '\n送出後由' + (m.cosign || []).join('、') + '同時會簽，全部同意即核准' +
          ((m.notifyOnly || []).length ? '；' + m.notifyOnly.join('、') + '知會' : '') + '。' : '') + '</div>' +
      '<label>假別</label><select id="f_type">' + types.map(t => opt(t, t)).join('') + '</select>' +
      '<div id="subWrap"><label>細項</label><select id="f_sub"></select></div>' +
      '<div class="grid2"><div><label>開始日期</label><input type="date" id="f_sd" value="' + m.today + '"></div>' +
      '<div><label>開始時段</label><select id="f_ss">' + slots(0) + '</select></div></div>' +
      '<div class="grid2"><div><label>結束日期</label><input type="date" id="f_ed" value="' + m.today + '"></div>' +
      '<div><label>結束時段</label><select id="f_es">' + slots(m.slots.length - 1) + '</select></div></div>' +
      (proxyNeeded ? '<label>代理人（同學）</label><select id="f_proxy">' + opt('', '請選擇') +

  async function readFiles(input) {
    const out = [];
    for (const f of Array.from(input.files || []).slice(0, 5)) {
      if (f.type.indexOf('image/') === 0) out.push(await compressImage(f));
      else {
        if (f.size > 5 * 1024 * 1024) throw new Error(f.name + ' 超過 5MB');
        out.push({ name: f.name, mime: f.type || 'application/pdf', data: await toBase64(f) });
      }
    }
    return out;
  }
  function toBase64(blob) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
  }
  function compressImage(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
      };
      img.onerror = () => rej(new Error('無法讀取圖片 ' + file.name));
      img.src = url;
    });
  }

    const log = (l.log || []).map(x => '<li>' + esc(x.step) + '：' + esc(x.name) + ' ' + esc(x.decision) + ' ' + esc(String(x.time).slice(5, 16)) +
      (x.comment ? '（' + esc(x.comment) + '）' : '') + '</li>').join('');
    return '<div class="card">' +
      '<div class="row" style="justify-content:space-between"><h3 style="margin:0">' + (l.student && extra ? esc(l.student) + '・' : '') +

        (r.status === '待補救' && !r.studentDone ? '<br><button class="ghost" style="padding:6px 12px;margin-top:4px" data-up-rem="' + esc(r.id) + '">已上傳 E-portfolio</button>' : '') +

  function pdcaHead(p, showStudent) {

  async function renderPdca() {
    loading('讀取 PDCA…');
    let r;
    try { r = await api('myPdca'); } catch (e) { return h('<div class="notice bad">' + esc(e.message) + '</div>'); }
    ME.pdcaTodo = r.pdcas.filter(p => p.status === '待填寫' || p.status === '退回修改').length; buildNav();
    $nav.querySelector('[data-tab="pdca"]').classList.add('on');
    if (!r.pdcas.length) return h('<div class="center">目前沒有需要填寫的 PDCA 👍<br><span class="muted">未於 3 個工作天前請假或遲到時，系統會自動派發。</span></div>');
    const min = r.minChars;
    h('<div class="notice info">第一次違規只需寫 P、D、C；重複違規須補寫前一張的 A（行動）。改善目標與 P、D、C 合計需 ' + min +
      ' 字以上。請於期限內完成填寫及全部簽章，逾期以遲到論。</div>' +
      r.pdcas.map(p => {
        const editable = p.status === '待填寫' || p.status === '退回修改';
        if (!editable) return '<div class="card">' + pdcaHead(p) + pdcaContentHtml(p) +
          (p.status === '簽核中' ? '<p class="muted" style="margin:6px 0 0">目前關卡：<b>' + esc(p.step) + '</b></p>' : '') + pdcaLogHtml(p) + '</div>';
        const ta = (k, label, rows) => '<label>' + label + '</label><textarea data-f="' + k + '" data-p="' + esc(p.id) + '" rows="' + (rows || 3) +
          '" placeholder="' + esc(PDCA_HINT[k] || '') + '">' + esc(p[k] || '') + '</textarea>';
        const rejected = (p.log || []).filter(x => x.decision === '退回').slice(-1)[0];
        return '<div class="card">' + pdcaHead(p) +
          (rejected ? '<div class="notice bad">' + esc(rejected.step + ' ' + rejected.name) + ' 退回：' + esc(rejected.comment) + '</div>' : '') +
          ta('explain', '違規說明（原因）', 2) +
          ta('goal', '改善目標', 2) + ta('plan', 'P 計畫') + ta('do', 'D 執行') + ta('check', 'C 檢查') +
          '<div class="counter" data-cnt="' + esc(p.id) + '"></div>' +
          (p.prev ? '<hr><div class="pdca-box"><b>前一張 PDCA：' + esc(p.prev.date + ' ' + p.prev.type) + '</b>P：' + esc(p.prev.plan || '') + '</div>' +
            ta('prevAction', '前一張的 A 行動（重複違規必填）') : '') +
          '<button class="block" data-sub="' + esc(p.id) + '" style="margin-top:12px">送出簽核</button></div>';
      }).join(''));
    const count = id => {
      const v = k => ($main.querySelector('[data-p="' + id + '"][data-f="' + k + '"]') || {}).value || '';
      const n = (v('goal') + v('plan') + v('do') + v('check')).replace(/\s/g, '').length;
      const el = $main.querySelector('[data-cnt="' + id + '"]');
      if (el) { el.textContent = '改善目標＋P＋D＋C：' + n + ' / ' + min + ' 字'; el.classList.toggle('ok', n >= min); }
      return n;
    };
    $main.querySelectorAll('[data-cnt]').forEach(el => count(el.dataset.cnt));
    $main.querySelectorAll('textarea[data-p]').forEach(t => t.oninput = () => count(t.dataset.p));
    $main.querySelectorAll('[data-sub]').forEach(b => b.onclick = async () => {
      const id = b.dataset.sub;
      const v = k => (($main.querySelector('[data-p="' + id + '"][data-f="' + k + '"]') || {}).value || '').trim();
      const data = { pdcaId: id, explain: v('explain'), goal: v('goal'), plan: v('plan'), do: v('do'), check: v('check'), prevAction: v('prevAction') };
      if (!data.explain || !data.goal || !data.plan || !data.do || !data.check) return toast('每一欄都要填寫', 'warn');
      if (count(id) < min) return toast('改善目標與 P、D、C 合計需 ' + min + ' 字以上', 'warn');
      if ($main.querySelector('[data-p="' + id + '"][data-f="prevAction"]') && !data.prevAction) return toast('請補寫前一張的 A 行動', 'warn');
      b.disabled = true; b.textContent = '送出中…';
      try { const x = await api('pdcaSubmit', data); toast(x.message, 'ok'); renderPdca(); }
      catch (e) { toast(e.message, 'bad'); b.disabled = false; b.textContent = '送出簽核'; }
    });
  }

        catch (e) { toast(e.message, 'bad'); }
        renderApprove();

      $main.querySelectorAll('[data-fxno]').forEach(b => b.onclick = () => fact(b.dataset.fxno, '退回'));
    } catch (e) { h('<div class="notice bad">' + esc(e.message) + '</div>'); }

            '　<span class="chip warn">' + esc((m.missing || []).join('、')) + '</span>　期限 ' + esc(m.due) + (m.overdue ? ' <span class="chip bad">已逾期</span>' : '') + '</li>').join('') + '</ul>' : '<p class="muted">無</p>') + '</div>' +
        '<div class="card"><h3>未完成的 PDCA（' + (r.openPdca || []).length + '）</h3>' + ((r.openPdca || []).length ? '<ul class="log" style="color:inherit">' +
          r.openPdca.map(p => '<li>' + esc(p.student) + '　' + esc(p.type) + ' ' + esc(p.date) + '　' + pdcaChip(p.status) +
            (p.status === '簽核中' ? ' 待 <b>' + esc(p.step) + '</b>' : '') + '　期限 ' + esc(p.due) + (p.overdue ? ' <span class="chip bad">已逾期</span>' : '') + '</li>').join('') +
          '</ul>' : '<p class="muted">無</p>') + '</div>' +
        '<div class="card"><h3>近 14 天差勤異常</h3>' + (anomalies ? '<div class="tablewrap"><table><tr><th>日期</th><th>學生</th><th>類型</th><th>說明</th></tr>' + anomalies + '</table></div>' : '<p class="muted">無</p>') + '</div>' +
        exportCardHtml(r));
      bindAbsence(); bindExport();
    } catch (e) { h('<div class="notice bad">' + esc(e.message) + '</div>'); }
  }

  /* ---------- 曠職認定（差勤負責老師）與違規紀錄單匯出 ---------- */
  const canJudge = () => (ME.profile.roles || []).includes('差勤負責老師');
  function absenceCardHtml(r) {
    const list = r.pendingAbsence || [];
    const judge = canJudge();
    const opt = (v, t) => '<option value="' + esc(v) + '">' + esc(t) + '</option>';
    return '<div class="card"><h3>曠職認定（' + list.length + '）</h3>' +
      (list.length ? list.map(x => '<div style="border-top:1px solid #eee;padding:8px 0"><b>' + esc(x.student) + '</b>　' + esc(x.date) +
        '<p class="muted" style="margin:4px 0">' + esc(x.reason) + '</p>' +
        (judge ? '<div class="grid2"><div><label>缺席時數</label><input type="number" min="0.5" step="0.5" value="' + x.absent + '" data-abh="' + esc(x.id) + '"></div>' +
          '<div><label>補充說明（選填）</label><input data-abr="' + esc(x.id) + '"></div></div>' +
          '<div class="grid2" style="margin-top:6px"><button data-abok="' + esc(x.id) + '">認定曠職（×' + ME.meta.absentRatio + '）</button>' +
          '<button class="danger" data-abno="' + esc(x.id) + '">不予認定</button></div>'
          : '<p class="muted" style="margin:0">待差勤負責老師認定</p>') + '</div>').join('') : '<p class="muted">目前沒有待認定的疑似曠職</p>') +
      (judge ? '<details style="margin-top:8px"><summary>手動新增曠職（擅自離院、同學代簽等）</summary>' +
        '<label>學生</label><select id="ab_stu">' + opt('', '請選擇') + (r.students || []).map(s => opt(s.id, s.name)).join('') + '</select>' +
        '<div class="grid2"><div><label>日期</label><input type="date" id="ab_date" value="' + ME.meta.today + '" max="' + ME.meta.today + '"></div>' +
        '<div><label>缺席時數</label><input type="number" id="ab_hours" min="0.5" step="0.5" placeholder="例如 1.5"></div></div>' +
        '<label>事由</label><input id="ab_reason" placeholder="例如：14:00–15:20 擅自離院">' +
        '<p class="muted" style="margin:4px 0 0">缺席時數以 1 小時為單位，未滿 1 小時以 1 小時計，×' + ME.meta.absentRatio + ' 為需補實習時數。</p>' +
        '<button class="block" id="ab_add" style="margin-top:8px">認定曠職</button></details>' : '') + '</div>';
  }
  function bindAbsence() {
    const q = sel => $main.querySelector(sel);
    $main.querySelectorAll('[data-abok]').forEach(b => b.onclick = async () => {
      const id = b.dataset.abok, hours = q('[data-abh="' + id + '"]').value;
      if (!confirm('確定認定為曠職？將派發 PDCA 並通知相關老師。')) return;
      b.disabled = true;
      try { const r = await api('absenceConfirm', { violationId: id, absentHours: hours, reason: q('[data-abr="' + id + '"]').value }); toast(r.message, 'ok'); }
      catch (e) { toast(e.message, 'bad'); }
      renderOverview();
    });
    $main.querySelectorAll('[data-abno]').forEach(b => b.onclick = async () => {
      const id = b.dataset.abno, comment = q('[data-abr="' + id + '"]').value;
      if (!comment) return toast('請在「補充說明」填寫不予認定的原因', 'warn');
      b.disabled = true;
      try { const r = await api('absenceDismiss', { violationId: id, comment }); toast(r.message, 'ok'); }
      catch (e) { toast(e.message, 'bad'); }
      renderOverview();
    });
    const add = document.getElementById('ab_add');
    if (add) add.onclick = async () => {
      const g = id => document.getElementById(id).value;
      if (!g('ab_stu')) return toast('請選擇學生', 'warn');
      if (!g('ab_hours')) return toast('請輸入缺席時數', 'warn');
      if (!g('ab_reason')) return toast('請填寫事由', 'warn');
      if (!confirm('確定認定為曠職？將派發 PDCA 並通知相關老師。')) return;
      add.disabled = true;
      try { const r = await api('absenceConfirm', { studentId: g('ab_stu'), date: g('ab_date'), absentHours: g('ab_hours'), reason: g('ab_reason') }); toast(r.message, 'ok'); }
      catch (e) { toast(e.message, 'bad'); }
      renderOverview();
    };
  }
  function exportCardHtml(r) {
    const opt = (v, t) => '<option value="' + esc(v) + '">' + esc(t) + '</option>';
    return '<div class="card"><h3>匯出差勤違規紀錄單</h3>' +
      '<label>學生</label><select id="ex_stu">' + opt('', '全部學生') + (r.students || []).map(s => opt(s.id, s.name)).join('') + '</select>' +
      '<div class="grid2"><div><label>起</label><input type="date" id="ex_from"></div><div><label>迄</label><input type="date" id="ex_to"></div></div>' +
      '<p class="muted" style="margin:4px 0 0">日期不填＝全部期間。產生 PDF 後寄到您的 Email，簽章欄自動帶入電子簽核。</p>' +
      '<button class="block" id="ex_btn" style="margin-top:8px">匯出 PDF（寄到我的 Email）</button></div>';
  }
  function bindExport() {
    const b = document.getElementById('ex_btn');
    if (!b) return;
    b.onclick = async () => {
      const g = id => document.getElementById(id).value;
      b.disabled = true; b.textContent = '產生中，約需 10–30 秒…';
      try { const r = await api('violationExport', { studentId: g('ex_stu'), from: g('ex_from'), to: g('ex_to') }); toast(r.message, 'ok'); }
      catch (e) { toast(e.message, 'bad'); }
      b.disabled = false; b.textContent = '匯出 PDF（寄到我的 Email）';
    };
  }

  /* ---------- 紙本補登打卡 ---------- */
  async function renderBackfill(dateArg) {
    const date = dateArg || ME.meta.today;
    loading('讀取學生名單…');
    let r;
    try { r = await api('backfillLoad', { date }); } catch (e) { return h('<div class="notice bad">' + esc(e.message) + '</div>'); }
    const opt = (v, t) => '<option value="' + esc(v) + '">' + esc(t) + '</option>';
    const rows = r.students.map(s => {
      const cell = (k, v) => v
        ? '<input type="time" value="' + esc(v) + '" disabled title="已有紀錄">'
        : '<input type="time" data-bf="' + esc(s.id) + '" data-k="' + k + '"' + (s.fullLeave ? ' disabled' : '') + '>';
      return '<div class="bfrow"><div><b>' + esc(s.name) + '</b>' +
        (s.fullLeave ? '<br><span class="chip gray">全日請假</span>' : (s.expStart && (s.expStart !== '08:00' || s.expEnd !== '17:00')
          ? '<br><span class="muted" style="font-size:12px">應 ' + esc(s.expStart) + '–' + esc(s.expEnd) + '</span>' : '')) +
        '</div>' + cell('in', s.inTime) + cell('out', s.outTime) + '</div>';
    }).join('');
    h('<div class="card"><h3>紙本補登打卡</h3>' +
      '<p class="muted">系統故障時改用紙本簽到退，恢復後照紙本補登。系統會照常判定遲到、早退（遲到一樣派發 PDCA），並把當晚誤判的「未簽到」改為已補登。灰色欄位表示已有紀錄。</p>' +
      '<label>日期</label><input type="date" id="bf_date" value="' + esc(r.date) + '" max="' + ME.meta.today + '">' +
      (r.working ? '' : '<div class="notice warn">這天不是上班日</div>') +
      '<div class="bfrow bfhead"><div>學生</div><div>簽到</div><div>簽退</div></div>' + (rows || '<p class="muted">這天沒有實習中的學生</p>') +
      '<label>核准的現場老師（紙本簽章者）</label><select id="bf_appr">' + opt('', '請選擇') + (ME.nightTeachers || []).map(t => opt(t.id, t.name)).join('') + '</select>' +
      '<label>備註（選填）</label><input id="bf_note" placeholder="例如：11/20 系統維護，改用紙本">' +
      '<button class="block" id="bf_btn" style="margin-top:14px">送出補登</button></div>');
    const $ = id => document.getElementById(id);
    $('bf_date').onchange = () => renderBackfill($('bf_date').value);
    $('bf_btn').onclick = async () => {
      const map = {};
      $main.querySelectorAll('[data-bf]').forEach(i => { if (i.value) (map[i.dataset.bf] = map[i.dataset.bf] || { id: i.dataset.bf })[i.dataset.k] = i.value; });
      const list = Object.values(map);
      if (!list.length) return toast('請至少填一個時間', 'warn');
      if (!$('bf_appr').value) return toast('請選擇核准的現場老師', 'warn');
      if (!confirm('確定補登 ' + list.length + ' 位學生的打卡紀錄？')) return;
      const btn = $('bf_btn'); btn.disabled = true; btn.textContent = '送出中…';
      try {
        const x = await api('backfillSave', { date: $('bf_date').value, approverId: $('bf_appr').value, note: $('bf_note').value, rows: list });
        await renderBackfill($('bf_date') ? $('bf_date').value : date);
        $main.insertAdjacentHTML('afterbegin', '<div class="notice ok">' + esc(x.message) + '</div>');
      } catch (e) { toast(e.message, 'bad'); btn.disabled = false; btn.textContent = '送出補登'; }
    };
  }

  /* ---------- 登錄時數 ---------- */
  async function renderLedger() {
    if (!cache.students) {
      loading('讀取學生名單…');
      try { cache.students = (await api('overview')).students; } catch (e) { return h('<div class="notice bad">' + esc(e.message) + '</div>'); }
    }
    const opt = (v, t) => '<option value="' + esc(v) + '">' + esc(t) + '</option>';
    const $ = id => document.getElementById(id);
    h('<div class="card"><h3>代為登錄時數</h3>' +
      '<p class="muted">一般情況請學生自行在「夜診值班」分頁登錄。這裡用於補登、補實習，或更正錯誤（手動調整可輸入負數）。</p>' +
      '<label>學生</label><select id="l_stu">' + opt('', '請選擇') + cache.students.map(s => opt(s.id, s.name + '（' + balText(s.summary.balance) + '）')).join('') + '</select>' +
      '<label>類別</label><select id="l_cat">' + ME.meta.ledgerCategories.map(c => opt(c, c)).join('') + '</select>' +
      '<label>日期</label><input type="date" id="l_date" value="' + ME.meta.today + '">' +
      '<div id="l_tWrap"><label>夜診老師</label><select id="l_teacher">' + opt('', '請選擇') + (ME.nightTeachers || []).map(t => opt(t.id, t.name)).join('') + '</select></div>' +
      '<label>時數</label><input id="l_hours" type="number" step="0.5" value="' + ME.meta.dutyHours + '">' +
      '<label>說明（選填）</label><input id="l_note">' +
      '<button class="block" id="l_btn" style="margin-top:14px">登錄</button></div>');
    const syncCat = () => { $('l_tWrap').hidden = $('l_cat').value !== '夜診值班'; };
    $('l_cat').onchange = syncCat; syncCat();
    $('l_btn').onclick = async () => {
      const personId = $('l_stu').value;
      if (!personId) return toast('請選擇學生', 'warn');
      const isDuty = $('l_cat').value === '夜診值班';
      if (isDuty && !$('l_teacher').value) return toast('請選擇夜診老師', 'warn');
      try {
        const x = await api('ledgerAdd', { personId, category: $('l_cat').value, date: $('l_date').value,
          teacherId: isDuty ? $('l_teacher').value : '', hours: Number($('l_hours').value), note: $('l_note').value });
        toast(x.message, 'ok'); cache.students = null; renderLedger();
      } catch (e) { toast(e.message, 'bad'); }
    };
  }

  boot();
})();
</script>
</body>
</html>
