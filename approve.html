<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>差勤系統簽核</title>
<style>
  :root { --bg:#f4f7f6; --card:#fff; --ink:#1d2b2a; --muted:#5f716f; --line:#e1e8e6; --accent:#0f766e; --bad:#b91c1c; --bad-soft:#fdecec; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; font-size:16px; line-height:1.6; }
  .card { max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  h2 { margin:0 0 4px; font-size:20px; }
  .muted { color:var(--muted); font-size:14px; margin:0 0 12px; }
  .box { background:var(--bg); border-radius:10px; padding:10px 12px; }
  .row { display:grid; grid-template-columns:5.5em 1fr; gap:8px; padding:4px 0; }
  .row b { color:var(--muted); font-weight:600; font-size:14px; }
  .row span { white-space:pre-wrap; word-break:break-word; }
  label { display:block; color:var(--muted); font-size:14px; margin:14px 0 4px; }
  textarea, input { width:100%; font:inherit; padding:10px; border:1px solid var(--line); border-radius:10px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:13px; background:var(--accent); color:#fff; width:100%; margin-top:10px; cursor:pointer; }
  button.no { background:var(--bad-soft); color:var(--bad); }
  button:disabled { opacity:.5; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .done { font-size:16px; font-weight:600; color:var(--accent); margin-top:14px; }
  .err { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<div class="card" id="card"><p class="muted">載入中…</p></div>
<script src="config.js"></script>
<script>
(function () {
  const CFG = window.APP_CONFIG;
  const card = document.getElementById('card');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const token = new URLSearchParams(location.search).get('t') || '';

  async function call(action, data) {
    const res = await fetch(CFG.GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, t: token }, data || {})) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '發生錯誤');
    return j;
  }

  function fail(msg) { card.innerHTML = '<h2>無法開啟</h2><p class="err">' + esc(msg) + '</p>'; }

  async function load() {
    if (!token) return fail('連結不完整，請從信中的按鈕開啟。');
    let r;
    try { r = await call('emailInfo'); } catch (e) { return fail(e.message); }
    document.title = r.title + '－差勤系統';
    const rows = r.rows.map(x => '<div class="row"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>').join('');
    let actions = '';
    if (!r.open) actions = '<p class="done">' + esc(r.closedText) + '</p>';
    else if (r.kind === 'remedial') actions = '<label>備註（選填）</label><input id="c" placeholder="例如：已補講並繳交教學討論單">' +
      '<button data-d="同意">補救教學已完成</button>';
    else actions = '<label>意見（退回時必填）</label><textarea id="c" rows="3"></textarea>' +
      '<div class="grid2"><button data-d="同意">同意</button><button class="no" data-d="退回">退回</button></div>';
    card.innerHTML = '<h2>' + esc(r.title) + '</h2><p class="muted">簽核人：' + esc(r.approver) + (r.step ? '（' + esc(r.step) + '）' : '') + '</p>' +
      '<div class="box">' + rows + '</div>' + actions;
    card.querySelectorAll('[data-d]').forEach(b => b.onclick = () => decide(b.dataset.d));
  }

  async function decide(d) {
    const comment = (document.getElementById('c') || {}).value || '';
    if (d === '退回' && !comment.trim()) { alert('退回請填寫原因'); return; }
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const r = await call('emailDecide', { decision: d, comment });
      card.innerHTML = '<h2>完成</h2><p class="done">' + esc(r.message) + '</p><p class="muted">可以關閉這個頁面了。</p>';
    } catch (e) {
      card.querySelectorAll('button').forEach(b => b.disabled = false);
      alert(e.message);
    }
  }

  load();
})();
</script>
</body>
</html>
