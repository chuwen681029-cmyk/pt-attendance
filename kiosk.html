<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實習打卡站</title>
<style>
  :root { --bg:#f4f7f6; --card:#fff; --ink:#1d2b2a; --muted:#5f716f; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; --line:#dfe7e5; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  .wrap { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap:28px; height:100%; padding:28px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px; display:flex; flex-direction:column; }
  .left { align-items:center; justify-content:center; text-align:center; }
  h1 { margin:0; font-size:28px; letter-spacing:.04em; }
  .station { color:var(--accent); font-weight:700; font-size:22px; margin-top:6px; }
  .clock { font-size:64px; font-weight:700; font-variant-numeric: tabular-nums; margin:14px 0 4px; }
  .date { color:var(--muted); font-size:18px; }
  canvas { margin-top:20px; width:min(46vh, 420px); height:min(46vh, 420px); image-rendering: pixelated; }
  .bar { width:min(46vh,420px); height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:12px; }
  .bar > i { display:block; height:100%; background:var(--accent); width:100%; transition: width .25s linear; }
  .hint { margin-top:14px; color:var(--muted); font-size:17px; }
  h2 { margin:0 0 14px; font-size:20px; }
  ul { list-style:none; margin:0; padding:0; overflow:auto; }
  li { display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid var(--line); font-size:20px; }
  li .t { font-variant-numeric: tabular-nums; color:var(--muted); width:64px; }
  li .n { flex:1; font-weight:600; }
  .tag { font-size:15px; padding:4px 10px; border-radius:999px; background:#e6f4f1; color:var(--accent); }
  .tag.late, .tag.early { background:#fff4e5; color:var(--warn); }
  .empty { color:var(--muted); padding:20px 4px; }
  .msg { max-width:560px; margin:auto; text-align:center; font-size:20px; line-height:1.7; }
  .err { color:var(--bad); font-size:15px; margin-top:10px; min-height:1em; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height:auto; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
(function () {
  const CFG = window.APP_CONFIG;
  const KEY = 'pt_kiosk_v1';
  const app = document.getElementById('app');
  let kiosk = null, offset = 0, lastSlot = -1, cryptoKey = null, stationName = '', stopped = false;

  // ---------- 首次設定：網址帶 #setup=代碼.密鑰 ----------
  const h = location.hash;
  // 清除本電腦的打卡站設定：網址後面加 #reset
  if (h === '#reset') {
    try { localStorage.removeItem(KEY); } catch (e) {}
    history.replaceState(null, '', location.pathname);
    app.innerHTML = '<div class="msg"><h1>已清除本電腦的打卡站設定</h1><p>這台電腦不再顯示打卡 QR Code。</p></div>';
    return;
  }
  if (h.indexOf('#setup=') === 0) {
    // 一次性設定網址：用設定碼向系統換取密鑰，設定碼用過即作廢
    const [id, code] = decodeURIComponent(h.slice(7)).split('.');
    history.replaceState(null, '', location.pathname);
    app.innerHTML = '<div class="msg"><h1>設定中…</h1></div>';
    fetch(CFG.GAS_URL + '?action=kioskActivate&k=' + encodeURIComponent(id || '') + '&c=' + encodeURIComponent(code || ''))
      .then(r => r.json()).then(j => {
        if (!j.ok) { app.innerHTML = '<div class="msg"><h1>無法設定打卡站</h1><p>' + String(j.error || '').replace(/</g, '&lt;') + '</p></div>'; return; }
        try { localStorage.setItem(KEY, JSON.stringify({ id: j.id, secret: j.secret })); } catch (e) {}
        location.reload();
      }).catch(() => { app.innerHTML = '<div class="msg"><h1>無法連線到系統</h1><p>請確認網路後，重新開啟設定網址。</p></div>'; });
    return;
  }
  try { kiosk = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { kiosk = null; }

  if (!kiosk) {
    app.innerHTML = '<div class="msg"><h1>此電腦尚未設定為打卡站</h1><p>請由管理者在試算表選單「差勤系統 → 新增打卡站」取得設定網址，並在本電腦開啟一次。</p></div>';
    return;
  }

  app.innerHTML =
    '<div class="wrap">' +
      '<section class="panel left">' +
        '<h1>物理治療實習學生打卡</h1><div class="station" id="station">　</div>' +
        '<div class="clock" id="clock">--:--:--</div><div class="date" id="date"></div>' +
        '<canvas id="qr" width="420" height="420" aria-label="打卡 QR Code"></canvas>' +
        '<div class="bar"><i id="bar"></i></div>' +
        '<div class="hint">請開啟 LINE 官方帳號選單「打卡」，掃描上方 QR Code</div>' +
        '<div class="err" id="err"></div>' +
      '</section>' +
      '<section class="panel"><h2>今日打卡</h2><ul id="list"><li class="empty">尚無紀錄</li></ul></section>' +
    '</div>';

  const $ = id => document.getElementById(id);
  const enc = new TextEncoder();
  const pad = n => (n < 10 ? '0' : '') + n;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const serverNow = () => Date.now() + offset;

  async function sign(slot) {
    if (!cryptoKey) cryptoKey = await crypto.subtle.importKey('raw', enc.encode(kiosk.secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const buf = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(kiosk.id + ':' + slot));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  }

  function drawQR(text) {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    const n = qr.getModuleCount(), quiet = 3, cv = $('qr'), ctx = cv.getContext('2d');
    const cell = Math.floor(cv.width / (n + quiet * 2));
    const off = Math.floor((cv.width - cell * n) / 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#111';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(off + c * cell, off + r * cell, cell, cell);
  }

  async function syncTime() {
    try {
      const t0 = Date.now();
      const res = await fetch(CFG.GAS_URL + '?action=time');
      const j = await res.json();
      const t1 = Date.now();
      if (j.ok) offset = j.now - Math.round((t0 + t1) / 2);
      $('err').textContent = '';
    } catch (e) { $('err').textContent = '無法連線到系統，請確認網路（時間同步失敗）'; }
  }

  let cur = { slot: 0, sig: '' };
  async function tick() {
    if (stopped) return;
    const now = serverNow();
    const d = new Date(now + 8 * 3600e3);
    $('clock').textContent = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
    $('date').textContent = d.getUTCFullYear() + ' 年 ' + (d.getUTCMonth() + 1) + ' 月 ' + d.getUTCDate() + ' 日　星期' + '日一二三四五六'[d.getUTCDay()];
    const period = CFG.QR_PERIOD_SEC * 1000;
    const slot = Math.floor(now / period);
    $('bar').style.width = (100 - ((now % period) / period) * 100) + '%';
    if (slot !== lastSlot) {
      lastSlot = slot;
      const sig = await sign(slot);
      cur = { slot, sig };
      drawQR('https://liff.line.me/' + CFG.LIFF_ID + '?k=' + encodeURIComponent(kiosk.id) + '&s=' + slot + '&t=' + sig);
    }
  }

  async function feed() {
    if (stopped || !cur.sig) return;
    try {
      const url = CFG.GAS_URL + '?action=kioskFeed&k=' + encodeURIComponent(kiosk.id) + '&s=' + cur.slot + '&t=' + cur.sig;
      const j = await (await fetch(url)).json();
      if (!j.ok && /不存在或已停用/.test(j.error || '')) {
        // 密鑰已失效（打卡站被停用或重新產生）→ 清掉本機設定，不再顯示 QR Code
        try { localStorage.removeItem(KEY); } catch (e) {}
        app.innerHTML = '<div class="msg"><h1>此打卡站已停用</h1><p>這台電腦的打卡站設定已失效並清除，QR Code 不再顯示。<br>若這台是醫院的打卡電腦，請管理者重新開啟新的設定網址。</p></div>';
        stopped = true; return;
      }
      if (!j.ok) { $('err').textContent = j.error || '讀取打卡名單失敗'; return; }
      $('err').textContent = '';
      if (j.station !== stationName) { stationName = j.station; $('station').textContent = stationName; document.title = '打卡站－' + stationName; }
      const list = $('list');
      if (!j.recent.length) { list.innerHTML = '<li class="empty">尚無紀錄</li>'; return; }
      list.innerHTML = j.recent.map(r => {
        const cls = r.verdict === '遲到' ? 'late' : r.verdict === '早退' ? 'early' : '';
        const label = r.type + (r.verdict && r.verdict !== '正常' ? '・' + r.verdict : '');
        return '<li><span class="t">' + esc(r.time) + '</span><span class="n">' + esc(r.name) + '</span><span class="tag ' + cls + '">' + esc(label) + '</span></li>';
      }).join('');
    } catch (e) { $('err').textContent = '無法連線到系統，請確認網路'; }
  }

  (async function start() {
    await syncTime();
    await tick();
    setInterval(tick, 250);
    setInterval(syncTime, 10 * 60 * 1000);
    feed();
    setInterval(feed, 15000);
  })();
})();
</script>
</body>
</html>
